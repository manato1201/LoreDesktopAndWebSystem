<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1060" width="1800" height="1060" role="img" aria-labelledby="dg-t-deploy-cross-domain dg-d-deploy-cross-domain">
<title id="dg-t-deploy-cross-domain">同じホスト名の配置と、別ドメインの配置の違い</title>
<desc id="dg-d-deploy-cross-domain">上段は docker compose など同じホスト名での配置で、ブラウザは localhost の3000番と4000番に話し、Cookie は同一サイトとして届く。下段は Vercel と Cloudflare Tunnel を使う別ドメインの配置で、ブラウザは Vercel にしか話さず、Next.js の rewrites が /api を Tunnel 経由でローカルPCの lorehub-api へ転送する。Set-Cookie は Vercel のドメインに保存される。デスクトップクライアントは同じPCの localhost:4000 に直接つなぐ。</desc>
