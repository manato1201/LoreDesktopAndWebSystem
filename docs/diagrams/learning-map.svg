<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 820" width="1900" height="820" role="img" aria-labelledby="dg-t-learning-map dg-d-learning-map">
<title id="dg-t-learning-map">学習資料の全体地図</title>
<desc id="dg-d-learning-map">学習資料は00から13の章でできている。00から始め、バックエンドの道(02 Rust、03 Axum、04 SQL、05 内容アドレス、06 diff)と、Webの道(01 Webの基礎、08 Next.js、09 UIの決めごと、12 Qt)に分かれる。07 認証と認可は03の後、10 アルゴリズム集は05の後、11 スクリプト・テスト・CIはその後、最後に13 拡張レシピ集で全体を使う。</desc>
