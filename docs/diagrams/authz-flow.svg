<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1260" width="1560" height="1260" role="img" aria-labelledby="dg-t-authz-flow dg-d-authz-flow">
<title id="dg-t-authz-flow">リクエストの認証・認可の判定フロー</title>
<desc id="dg-d-authz-flow">リクエストはまず有効なアクセストークンの確認を受け、なければ401。ユーザーが特定できたら、組織の管理操作ならOwnerまたはAdminかを確認し、満たさなければ403と監査ログ。パスを扱う操作ならパスACLで許可されているかを確認し、拒否なら403と監査ログ。通ればハンドラが実行される。閲覧系の一部(ツリー、コミット一覧)はパスで絞り込まない。</desc>
<defs><style>.dg-bg{fill:#f7f8f5}.dg-chip{fill:#f7f8f5}.dg-tile{fill:#ffffff;stroke:#cdd3ca;stroke-width:1.5}.dg-name{fill:#14171a}.dg-cap{fill:#5a615c}.dg-text{fill:#14171a}.dg-text2{fill:#5a615c}.dg-elabel{paint-order:stroke;stroke:#f7f8f5;stroke-width:5px;stroke-linejoin:round}.dg-edge{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dg-dash{stroke-dasharray:7 6}.dg-badge-t{fill:#ffffff}.c-green{color:#14a34e}.tx-green{fill:#14a34e}.bx-green{fill:#eef7f1;stroke:#8fcea8;stroke-width:1.5}.gr-green{fill:#eef7f1;stroke:#8fcea8;stroke-width:1.5}.ed-green{stroke:#14a34e}.mk-green{fill:#14a34e}.bd-green{fill:#14a34e}.c-blue{color:#2c6fd1}.tx-blue{fill:#2c6fd1}.bx-blue{fill:#eef3fc;stroke:#9bbcec;stroke-width:1.5}.gr-blue{fill:#eef3fc;stroke:#9bbcec;stroke-width:1.5}.ed-blue{stroke:#2c6fd1}.mk-blue{fill:#2c6fd1}.bd-blue{fill:#2c6fd1}.c-orange{color:#c2691a}.tx-orange{fill:#c2691a}.bx-orange{fill:#fbf3ea;stroke:#e3b27f;stroke-width:1.5}.gr-orange{fill:#fbf3ea;stroke:#e3b27f;stroke-width:1.5}.ed-orange{stroke:#c2691a}.mk-orange{fill:#c2691a}.bd-orange{fill:#c2691a}.c-gray{color:#5f6661}.tx-gray{fill:#5f6661}.bx-gray{fill:#f1f3ef;stroke:#c5cbc1;stroke-width:1.5}.gr-gray{fill:#f1f3ef;stroke:#c5cbc1;stroke-width:1.5}.ed-gray{stroke:#5f6661}.mk-gray{fill:#5f6661}.bd-gray{fill:#5f6661}.c-red{color:#c23b4a}.tx-red{fill:#c23b4a}.bx-red{fill:#fcefef;stroke:#e3a1a9;stroke-width:1.5}.gr-red{fill:#fcefef;stroke:#e3a1a9;stroke-width:1.5}.ed-red{stroke:#c23b4a}.mk-red{fill:#c23b4a}.bd-red{fill:#c23b4a}</style><marker id="dg-authz-flow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-green" d="M1 1 L9 5 L1 9 z"/></marker><marker id="dg-authz-flow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-blue" d="M1 1 L9 5 L1 9 z"/></marker><marker id="dg-authz-flow-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-orange" d="M1 1 L9 5 L1 9 z"/></marker><marker id="dg-authz-flow-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-gray" d="M1 1 L9 5 L1 9 z"/></marker><marker id="dg-authz-flow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-red" d="M1 1 L9 5 L1 9 z"/></marker></defs>
<rect class="dg-bg" width="1560" height="1260" rx="18"/>
<path class="dg-edge ed-blue" d="M 520 198 L 520 246" marker-end="url(#dg-authz-flow-arrow-blue)"/>
<path class="dg-edge ed-red dg-dash" d="M 617.9 305 L 909 305" marker-end="url(#dg-authz-flow-arrow-red)"/><text class="dg-elabel tx-red" x="745.5" y="295" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12">いいえ</text>
<path class="dg-edge ed-blue" d="M 520 361 L 520 415" marker-end="url(#dg-authz-flow-arrow-blue)"/><text class="dg-elabel tx-blue" x="530" y="392" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12">はい</text>
