<path class="dg-edge ed-blue" d="M 520 636 L 520 701" marker-end="url(#dg-authz-flow-arrow-blue)"/><text class="dg-elabel tx-blue" x="530" y="672.5" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12">いいえ</text>
<path class="dg-edge ed-blue" d="M 520 816 L 520 866" marker-end="url(#dg-authz-flow-arrow-blue)"/><text class="dg-elabel tx-blue" x="530" y="845" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12">はい</text>
<path class="dg-edge ed-gray dg-dash" d="M 347 760 L 260 760 Q 250 760 250 770 L 250 1075 Q 250 1085 260 1085 L 441 1085" marker-end="url(#dg-authz-flow-arrow-gray)"/><text class="dg-elabel tx-gray" x="231.3" y="750" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12">いいえ(認証だけで通る)</text>
