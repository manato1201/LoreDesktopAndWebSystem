<polygon class="bx-blue" points="520,252 614.9,305 520,358 425.1,305"/><text class="dg-name" x="520" y="300" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">有効な</text><text class="dg-name" x="520" y="320" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">アクセストークン?</text>
<rect class="bx-red" x="915" y="276" width="250" height="58" rx="10"/><text class="dg-name" x="1040" y="300" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">401 Unauthorized</text><text class="dg-name" x="1040" y="320" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">(誰か分からない)</text>
<rect class="bx-green" x="370" y="421" width="300" height="38" rx="10"/><text class="dg-name" x="520" y="445" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">ユーザー(OrgMember)を特定</text>
<polygon class="bx-blue" points="520,527 690,580 520,633 350,580"/><text class="dg-name" x="520" y="575" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">組織の管理操作?</text><text class="dg-name" x="520" y="595" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">(削除 · ロール · 招待 · ACL · toggle)</text>
<polygon class="bx-blue" points="1040,527 1115,580 1040,633 965,580"/><text class="dg-name" x="1040" y="575" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">Owner /</text><text class="dg-name" x="1040" y="595" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">Admin?</text>
<rect class="bx-red" x="895" y="711" width="290" height="58" rx="10"/><text class="dg-name" x="1040" y="735" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">403 + 監査ログ</text><text class="dg-name" x="1040" y="755" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">requires Owner or Admin</text>
<polygon class="bx-blue" points="520,707 690,760 520,813 350,760"/><text class="dg-name" x="520" y="755" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">パスを扱う操作?</text><text class="dg-name" x="520" y="775" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">(取得 · upload · lock · stage · diff)</text>
<polygon class="bx-blue" points="520,872 645,925 520,978 395,925"/><text class="dg-name" x="520" y="920" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">パスACLで</text><text class="dg-name" x="520" y="940" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">許可されている?</text>
<rect class="bx-red" x="895" y="896" width="290" height="58" rx="10"/><text class="dg-name" x="1040" y="920" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">403 + 監査ログ</text><text class="dg-name" x="1040" y="940" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">denied {read|write|lock}</text>
<rect class="bx-green" x="447" y="1065" width="146" height="40" rx="20"/><text class="dg-name" x="520" y="1090" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">ハンドラを実行</text>
<rect class="bx-orange" x="800" y="1151" width="560" height="58" rx="10"/><text class="dg-name" x="1080" y="1175" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">注意: ツリー・コミット一覧・コミット詳細は</text><text class="dg-name" x="1080" y="1195" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="14" font-weight="600">パスで絞り込まない(ファイル名は見える)</text>
<text class="dg-text" x="40" y="64" text-anchor="start" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="26" font-weight="700">リクエストの判定: 401 と 403 の使い分け</text>
<text class="dg-text2" x="40" y="92" text-anchor="start" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="13">401 = 認証されていない(誰か分からない) / 403 = 認証はされたが許可がない。どちらの拒否も、拒否そのものを監査ログに残す(401 を除く)</text>
</svg>
