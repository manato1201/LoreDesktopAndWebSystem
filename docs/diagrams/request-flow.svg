<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 650" width="1740" height="650" role="img" aria-labelledby="dg-t-request-flow dg-d-request-flow">
<title id="dg-t-request-flow">リポジトリ画面が表示されるまでの流れ</title>
<desc id="dg-d-request-flow">ブラウザが Next.js サーバーにリポジトリ画面を要求すると、Next.js はログイン確認と6本のAPI取得を lorehub-api に並列で依頼し、APIは SQLite を読んで JSON を返す。Next.js はサーバーコンポーネントで HTML を組み立ててブラウザに返し、ブラウザが表示する。手順は1から9の番号で示す。</desc>
