<text class="dg-text" x="40" y="64" text-anchor="start" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="26" font-weight="700">ファイルがコミットになるまで</text>
