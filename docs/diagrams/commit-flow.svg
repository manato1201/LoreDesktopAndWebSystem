<text class="tx-blue" x="920" y="830" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="12">ステージ後に同じパスを再アップロードしても、</text><text class="tx-blue" x="920" y="847" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="12">次のコミットが取り込む内容は変わらない</text><text class="tx-blue" x="920" y="864" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif" font-size="12">(git の index と同じ)</text>
