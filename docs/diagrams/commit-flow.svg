rkerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-orange" d="M1 1 L9 5 L1 9 z"/></marker><marker id="dg-commit-flow-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-gray" d="M1 1 L9 5 L1 9 z"/></marker><marker id="dg-commit-flow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk-red" d="M1 1 L9 5 L1 9 z"/></marker></defs>
