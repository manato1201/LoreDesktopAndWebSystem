<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1100" width="1900" height="1100" role="img" aria-labelledby="dg-t-commit-flow dg-d-commit-flow">
<title id="dg-t-commit-flow">ファイルがコミットになるまでの流れ</title>
<desc id="dg-d-commit-flow">3つのAPI呼び出しの順に進む。1. アップロード: 書き込み権限を確認し、内容の SHA-256 を計算して blobs/ に保存し、file_blobs と staged_content を更新する。2. ステージ: その時点の content_hash を pending_changes に確定して記録する。3. コミット: 1つのトランザクションの中で、ステージ済みの有無と内容の保存済みを検証し、親のツリーに変更を適用し、コミットハッシュを計算して各テーブルに書き込み、ブランチの先頭を進める。</desc>
