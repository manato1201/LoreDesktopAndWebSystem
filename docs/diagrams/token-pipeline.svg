<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" width="1700" height="900" role="img" aria-labelledby="dg-t-token-pipeline dg-d-token-pipeline">
<title id="dg-t-token-pipeline">デザイントークンの生成パイプライン</title>
<desc id="dg-d-token-pipeline">開発者は design-tokens/tokens.json だけを編集する。tools/gen-tokens.mjs がそこから、Web用の tokens.generated.css と、LoreForge Client・Server Admin それぞれの Theme.qml を生成する。CI は同じスクリプトを --check で実行し、生成物がコミット済みのものと食い違えば失敗させる。</desc>
