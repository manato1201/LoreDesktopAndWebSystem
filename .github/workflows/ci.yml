name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lorehub-api:
    name: lorehub-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lorehub-api
    steps:
      - uses: actions/checkout@v4

      # actions-rs/toolchain is archived/unmaintained; dtolnay/rust-toolchain
      # is the current standard replacement.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lorehub-api

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

  lorehub-web:
    name: lorehub-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lorehub-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lorehub-web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: npm run lint
        run: npm run lint

      - name: npm test
        run: npm test
