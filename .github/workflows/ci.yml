name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lorehub-api:
    name: lorehub-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lorehub-api
    steps:
      - uses: actions/checkout@v4

      # actions-rs/toolchain is archived/unmaintained; dtolnay/rust-toolchain
      # is the current standard replacement.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lorehub-api

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

  generated-files:
    name: generated files (tokens, diagrams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Web CSS and both Qt Theme.qml files are generated from
      # design-tokens/tokens.json; this fails if one was edited by hand or
      # tokens.json changed without regenerating.
      - name: tokens are in sync
        run: node tools/gen-tokens.mjs --check

      # docs/diagrams/*.svg and the diagrams embedded in
      # docs/lore-ecosystem-docs.html are generated from tools/diagrams/specs;
      # this fails if a spec changed without regenerating (or a generated
      # file was edited by hand).
      - name: diagrams are in sync
        run: node tools/diagrams/build.mjs --check

      - name: diagram renderer tests
        run: node --test tools/diagrams/render.test.mjs

  lorehub-web:
    name: lorehub-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lorehub-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lorehub-web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: npm run lint
        run: npm run lint

      - name: npm test
        run: npm test
