[package]
name = "lorehub-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
argon2 = "0.5"
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
base64 = "0.22"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
# Pure-Rust TLS backend (rustls) so SMTP sending doesn't need an OpenSSL
# install on Windows dev machines — see email.rs.
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
axum-prometheus = "0.10.1"
# Content hashing for the content-addressed VCS blob store — see
# src/content_hash.rs / src/blob_store.rs.
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Isolated temp directories for src/blob_store.rs's filesystem I/O tests.
tempfile = "3"
